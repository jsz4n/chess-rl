[project]
name = "chess-gym"
version = "0.1.0"
description = "Gymnasium environment for chess with masked actions and pygame rendering"
readme = "README.md"
license = "MIT"
authors = [{ name = "jsz4n" }]
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.2",
    "gymnasium>=1.3.0",
    "numpy>=2.5.3",
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chess_gym"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
